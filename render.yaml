services:
  - type: web
    name: lms-agent-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r agent_system/requirements.txt
    startCommand: uvicorn agent_system.bot_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LMS_DATA_SOURCE
        value: .
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
